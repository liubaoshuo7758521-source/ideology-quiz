<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精美跳动爱心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e27;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .heart:before,
        .heart:after {
            position: absolute;
            content: "";
            left: 50px;
            top: 0;
            width: 50px;
            height: 80px;
            background: linear-gradient(45deg, #ff006e, #ff4081, #ff6b9d);
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.8),
                        0 0 60px rgba(255, 64, 129, 0.6),
                        inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
            20% {
                transform: scale(1.25);
                filter: brightness(1.2);
            }
            40% {
                transform: scale(1);
                filter: brightness(1);
            }
            60% {
                transform: scale(1.15);
                filter: brightness(1.1);
            }
            80% {
                transform: scale(1);
                filter: brightness(1);
            }
            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }

        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 0, 110, 0.4) 0%, rgba(255, 0, 110, 0.2) 40%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.4;
            }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 3s linear infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .message {
            margin-top: 50px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.8);
            animation: glow-text 2s ease-in-out infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes glow-text {
            from {
                text-shadow: 0 0 20px rgba(255, 0, 110, 0.8),
                            0 0 30px rgba(255, 0, 110, 0.6),
                            0 0 40px rgba(255, 0, 110, 0.4);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 0, 110, 1),
                            0 0 40px rgba(255, 0, 110, 0.8),
                            0 0 50px rgba(255, 0, 110, 0.6);
            }
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 0, 110, 0.6);
            animation: float-up 8s linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .ripple {
            position: absolute;
            border: 2px solid rgba(255, 0, 110, 0.6);
            border-radius: 50%;
            animation: ripple-effect 2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            0% {
                width: 100px;
                height: 100px;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    
    <div class="container">
        <div class="heart-wrapper">
            <div class="glow"></div>
            <div class="heart" id="heart"></div>
            <div class="sparkles" id="sparkles"></div>
            <div class="ripple"></div>
        </div>
        <div class="message">爱在心中跳动</div>
    </div>

    <script>
        // 创建背景漂浮爱心
        function createFloatingHearts() {
            const heartsBg = document.getElementById('heartsBg');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '💝'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                
                heartsBg.appendChild(heart);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 2000);
        }

        // 创建闪光效果
        function createSparkles() {
            const sparklesContainer = document.getElementById('sparkles');
            const sparkleCount = 12;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // 围绕爱心创建圆形分布的闪光点
                const angle = (Math.PI * 2 * i) / sparkleCount;
                const radius = 80;
                const x = Math.cos(angle) * radius + 150;
                const y = Math.sin(angle) * radius + 150;
                
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                sparkle.style.animationDelay = (i * 0.2) + 's';
                
                sparklesContainer.appendChild(sparkle);
            }
        }

        // 点击爱心时的特殊效果
        document.getElementById('heart').addEventListener('click', function(e) {
            // 创建爆炸效果
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '10px';
                particle.style.height = '10px';
                particle.style.background = `hsl(${Math.random() * 60 + 330}, 100%, 60%)`;
                particle.style.borderRadius = '50%';
                particle.style.left = '150px';
                particle.style.top = '135px';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '1000';
                
                const angle = (Math.PI * 2 * i) / 20;
                const velocity = Math.random() * 200 + 100;
                const duration = Math.random() * 1000 + 1000;
                
                particle.style.transition = `all ${duration}ms cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                
                document.querySelector('.heart-wrapper').appendChild(particle);
                
                setTimeout(() => {
                    particle.style.transform = `translate(${Math.cos(angle) * velocity}px, ${Math.sin(angle) * velocity}px) scale(0)`;
                    particle.style.opacity = '0';
                }, 10);
                
                setTimeout(() => {
                    particle.remove();
                }, duration);
            }
            
            // 改变心跳节奏
            this.style.animation = 'none';
            setTimeout(() => {
                this.style.animation = 'heartbeat 0.5s ease-in-out 3';
            }, 10);
            
            setTimeout(() => {
                this.style.animation = 'heartbeat 1.5s ease-in-out infinite';
            }, 1500);
        });

        // 初始化
        window.addEventListener('load', () => {
            createFloatingHearts();
            createSparkles();
        });

        // 鼠标跟随效果
        document.addEventListener('mousemove', (e) => {
            const heart = document.querySelector('.heart');
            const rect = heart.getBoundingClientRect();
            const heartX = rect.left + rect.width / 2;
            const heartY = rect.top + rect.height / 2;
            
            const distance = Math.sqrt(Math.pow(e.clientX - heartX, 2) + Math.pow(e.clientY - heartY, 2));
            
            if (distance < 200) {
                const intensity = 1 - (distance / 200);
                heart.style.filter = `brightness(${1 + intensity * 0.5})`;
                document.querySelector('.glow').style.opacity = 0.8 + intensity * 0.2;
            } else {
                heart.style.filter = 'brightness(1)';
                document.querySelector('.glow').style.opacity = 0.8;
            }
        });
    </script>
</body>
</html>
