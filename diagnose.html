<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题库诊断</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>题库加载诊断</h1>
    <div id="status"></div>
    <div id="details"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');

        function addStatus(message, type) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
        }

        function addDetails(title, content) {
            const section = document.createElement('div');
            section.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(content, null, 2)}</pre>`;
            detailsDiv.appendChild(section);
        }

        // 检查 questionBank
        if (typeof questionBank === 'undefined') {
            addStatus('❌ questionBank 未定义！JavaScript文件可能加载失败。', 'error');
            addStatus('请检查浏览器控制台（F12）查看错误信息', 'info');
        } else {
            addStatus('✅ questionBank 已加载', 'success');

            // 检查各题型
            const types = ['singleChoice', 'trueFalse', 'shortAnswer', 'essay'];
            types.forEach(type => {
                if (questionBank[type]) {
                    addStatus(`✅ ${type}: ${questionBank[type].length} 题`, 'success');
                } else {
                    addStatus(`⚠️ ${type}: 未定义`, 'error');
                }
            });

            // 提取所有模块
            const moduleSet = new Set();
            types.forEach(type => {
                if (questionBank[type]) {
                    questionBank[type].forEach(q => {
                        moduleSet.add(q.module);
                    });
                }
            });

            const modules = Array.from(moduleSet).sort();
            addStatus(`📊 总共 ${modules.length} 个模块`, modules.length === 11 ? 'success' : 'error');

            addDetails('所有模块', modules);

            // 显示前5个题目作为示例
            if (questionBank.singleChoice && questionBank.singleChoice.length > 0) {
                addDetails('单选题示例（前5题）', questionBank.singleChoice.slice(0, 5));
            }
        }

        // 显示加载的脚本信息
        const scripts = document.getElementsByTagName('script');
        let scriptInfo = [];
        for (let script of scripts) {
            if (script.src) {
                scriptInfo.push(script.src);
            }
        }
        addDetails('已加载的脚本', scriptInfo);
    </script>

    <script src="modern-history-questions.js?v=7"></script>
</body>
</html>
