<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思想道德与法治 - 答题练习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', Arial, sans-serif;
            background: #f5f5f5;
            background-image: url('https://maas-log-prod.cn-wlcb.ufileos.com/anthropic/7e58a03e-c3d7-49de-9a28-011ec79825e9/f7da9d2316ab071fbe632245a99c4138.png?UCloudPublicKey=TOKEN_e15ba47a-d098-4fbd-9afc-a0dcf0e4e621&Expires=1767934814&Signature=Zi/FLcluKzewrrPuSwG11PXusXM=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 100px 20px 20px;
            position: relative;
            overflow-x: hidden;
            font-size: 18px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(245, 245, 245, 0.2);
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #c8232c 0%, #e63950 50%, #c8232c 100%);
            color: white;
            padding: 25px 30px;
            border-bottom: 3px solid #8b1a1a;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .main-content {
            padding: 30px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: white;
            border: 2px solid #999;
            padding: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .menu-card:hover {
            border-color: #c8232c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu-card h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.4em;
            font-weight: 500;
        }

        .menu-card p {
            color: #666;
            font-size: 1em;
        }

        .menu-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .btn {
            background: #c8232c;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background: #a71e2a;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .hidden {
            display: none;
        }

        .module-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .module-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .module-btn:hover {
            border-color: #c8232c;
            background: #fff5f5;
        }

        .module-btn.selected {
            background: #c8232c;
            color: white;
            border-color: #c8232c;
        }

        .question-container {
            background: #f8f9fa;
            padding: 25px;
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #dee2e6;
        }

        .question-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #c8232c;
        }

        .question-type {
            background: #c8232c;
            color: white;
            padding: 5px 15px;
            font-size: 0.9em;
        }

        .question-content {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #333;
        }

        .options-container {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 1em;
        }

        .option-btn:hover {
            border-color: #c8232c;
            background: #fff5f5;
        }

        .option-btn.selected {
            background: #c8232c;
            color: white;
            border-color: #c8232c;
        }

        .option-btn.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .option-btn.wrong {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            font-size: 1em;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #c8232c;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #c8232c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.95;
        }

        .wrong-questions-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .wrong-question-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #dc3545;
        }

        .wrong-question-item .question-text {
            font-weight: 500;
            margin-bottom: 10px;
        }

        .wrong-question-item .your-answer {
            color: #dc3545;
            margin: 5px 0;
        }

        .wrong-question-item .correct-answer {
            color: #28a745;
            margin: 5px 0;
        }

        .back-btn {
            margin-bottom: 20px;
        }

        .essay-answer {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 15px;
        }

        .essay-answer:focus {
            outline: none;
            border-color: #c8232c;
        }

        .reference-answer {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .reference-answer h4 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .reference-answer p {
            color: #856404;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .question-content {
                font-size: 1em;
            }

            .option-btn {
                padding: 12px 15px;
                font-size: 1em;
            }
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #999;
            font-size: 0.85em;
            border-top: 1px solid #eee;
            margin-top: 40px;
        }

        .footer-text {
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 思想道德与法治</h1>
            <p>答题练习系统 - 400题题库</p>
        </div>

        <div class="main-content">
            <!-- 主菜单 -->
            <div id="mainMenu">
                <div class="menu-grid">
                    <div class="menu-card" onclick="showModuleSelection()">
                        <div class="icon">📖</div>
                        <h3>专项练习</h3>
                        <p>按模块选择题目进行练习</p>
                    </div>
                    <div class="menu-card" onclick="startMockExam()">
                        <div class="icon">🎯</div>
                        <h3>模拟考试</h3>
                        <p>随机抽题，模拟真实考试</p>
                    </div>
                    <div class="menu-card" onclick="showWrongQuestions()">
                        <div class="icon">📝</div>
                        <h3>错题本</h3>
                        <p>复习错过的题目</p>
                    </div>
                    <div class="menu-card" onclick="showStats()">
                        <div class="icon">📊</div>
                        <h3>学习统计</h3>
                        <p>查看学习进度和成绩</p>
                    </div>
                </div>
            </div>

            <!-- 模块选择 -->
            <div id="moduleSelection" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2>选择练习模块</h2>
                <p style="margin-bottom: 20px; color: #666;">可以多选，已选模块会高亮显示</p>
                <div class="module-selection" id="moduleButtons"></div>
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="startModulePractice()">开始练习</button>
                </div>
            </div>

            <!-- 答题界面 -->
            <div id="quizArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="endQuiz()">← 结束练习</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="number" id="currentQuestion">1</div>
                        <div class="label">当前题目</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="correctCount">0</div>
                        <div class="label">正确</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="wrongCount">0</div>
                        <div class="label">错误</div>
                    </div>
                </div>
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number" id="questionNumber">第 1 题</span>
                        <span class="question-type" id="questionType">单选题</span>
                    </div>
                    <div class="question-content" id="questionContent"></div>
                    <div class="options-container" id="optionsContainer"></div>
                    <div id="feedback" class="feedback hidden"></div>
                    <div id="referenceAnswer" class="reference-answer hidden"></div>
                    <div style="margin-top: 20px; text-align: center;">
                        <button class="btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>
                        <button class="btn btn-success hidden" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
                    </div>
                </div>
            </div>

            <!-- 结果页面 -->
            <div id="resultArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="text-align: center; margin-bottom: 30px;">练习完成！</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="number" id="totalQuestions">0</div>
                        <div class="label">总题数</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="finalCorrect">0</div>
                        <div class="label">正确</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="finalWrong">0</div>
                        <div class="label">错误</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="accuracy">0%</div>
                        <div class="label">正确率</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="reviewWrongAnswers()">查看错题</button>
                    <button class="btn btn-success" onclick="showMainMenu()">返回主菜单</button>
                </div>
            </div>

            <!-- 错题本 -->
            <div id="wrongQuestionsArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="margin-bottom: 20px;">错题本</h2>
                <p id="wrongQuestionsCount" style="margin-bottom: 20px; color: #666;"></p>
                <div class="wrong-questions-list" id="wrongQuestionsList"></div>
            </div>

            <!-- 统计页面 -->
            <div id="statsArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="margin-bottom: 20px;">学习统计</h2>
                <div class="stats-container" id="learningStats"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-text">MADE BY JASONS</div>
        </div>
    </div>

    <script>
        // 题库数据
        const questionBank = {
            singleChoice: [
                // 模块一：领悟人生真谛 把握人生方向（20题）
                { module: "模块一：领悟人生真谛", number: 1, question: "马克思主义认为，人的本质属性是（）", options: ["A. 自然属性", "B. 社会属性", "C. 精神属性", "D. 生物属性"], answer: "B" },
                { module: "模块一：领悟人生真谛", number: 2, question: "人生目的回答的是（）", options: ["A. 人为什么活着", "B. 人应该怎样活着", "C. 什么样的人生才有价值", "D. 人生道路的选择"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 3, question: "作为一种社会意识形态，价值观是社会存在的反映，是在一定的社会存在的基础上产生的，这体现了价值观的（）", options: ["A. 客观性", "B. 主观性", "C. 历史性", "D. 阶级性"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 4, question: "评价人生价值的根本尺度是（）", options: ["A. 个人的社会地位", "B. 个人的财富积累", "C. 个人对社会和他人的贡献", "D. 个人的自我满足程度"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 5, question: "实现人生价值的根本途径是（）", options: ["A. 提升个人能力", "B. 投身社会实践", "C. 追求个人理想", "D. 完善个人品德"], answer: "B" },
                { module: "模块一：领悟人生真谛", number: 6, question: "下列关于人生态度的说法，错误的是（）", options: ["A. 人生态度是指人们通过生活实践形成的对人生问题的一种稳定的心理倾向和基本意愿", "B. 人生态度决定人生目的", "C. 人生态度影响人生价值的实现", "D. 积极进取的人生态度是实现人生价值的重要条件"], answer: "B" },
                { module: "模块一：领悟人生真谛", number: 7, question: "人与自然相处时应秉持的首要态度是（）", options: ["A. 尊重自然", "B. 顺应自然", "C. 保护自然", "D. 利用自然"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 8, question: "处理个人与他人关系的首要原则是（）", options: ["A. 诚信原则", "B. 宽容原则", "C. 平等原则", "D. 互助原则"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 9, question: "个人与社会的关系，最根本的是（）", options: ["A. 个人利益与社会利益的关系", "B. 个人权利与社会权利的关系", "C. 个人自由与社会自由的关系", "D. 个人发展与社会发展的关系"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 10, question: "下列不属于人生价值实现条件的是（）", options: ["A. 实现人生价值要从社会客观条件出发", "B. 实现人生价值要从个体自身条件出发", "C. 不断增强实现人生价值的能力和本领", "D. 追求个人利益的最大化"], answer: "D" },
                { module: "模块一：领悟人生真谛", number: 11, question: "人生价值的本质是（）", options: ["A. 个人对社会的责任和贡献", "B. 社会对个人的尊重和满足", "C. 个人的自我完善", "D. 个人的幸福生活"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 12, question: "作为人们对生活在其中的世界以及人与世界关系的总体看法和根本观点，世界观决定着（）", options: ["A. 人生目的", "B. 人生态度", "C. 人生价值", "D. 以上都是"], answer: "D" },
                { module: "模块一：领悟人生真谛", number: 13, question: "下列关于理想与现实关系的说法，正确的是（）", options: ["A. 理想与现实是对立的", "B. 理想与现实是统一的", "C. 理想与现实既对立又统一", "D. 理想与现实没有关系"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 14, question: "实现人生价值的主观条件不包括（）", options: ["A. 树立正确的人生价值观", "B. 具备良好的身体素质", "C. 提高自身的道德素质", "D. 增强自身的能力本领"], answer: "B" },
                { module: "模块一：领悟人生真谛", number: 15, question: "人们在实践中形成的对于人生目的和意义的根本看法，称为（）", options: ["A. 人生观", "B. 世界观", "C. 价值观", "D. 道德观"], answer: "A" },
                { module: "模块一：领悟人生真谛", number: 16, question: "下列属于积极进取的人生态度的是（）", options: ["A. 得过且过", "B. 随遇而安", "C. 自强不息", "D. 怨天尤人"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 17, question: "个人利益与社会利益的关系是（）", options: ["A. 个人利益服从社会利益", "B. 社会利益服从个人利益", "C. 个人利益与社会利益相互对立", "D. 个人利益与社会利益相互统一"], answer: "D" },
                { module: "模块一：领悟人生真谛", number: 18, question: "人生价值评价的基本尺度是（）", options: ["A. 是否符合社会发展的客观规律", "B. 是否促进了历史的进步", "C. 个人对社会和他人的贡献", "D. 社会对个人的尊重和满足"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 19, question: "下列关于人与自然关系的说法，错误的是（）", options: ["A. 人是自然界的一部分", "B. 人与自然是相互依存、相互联系的整体", "C. 人类可以任意改造自然", "D. 人类应该尊重自然、顺应自然、保护自然"], answer: "C" },
                { module: "模块一：领悟人生真谛", number: 20, question: "处理个人与集体关系的核心是（）", options: ["A. 个人利益服从集体利益", "B. 集体利益服从个人利益", "C. 个人利益与集体利益相互平衡", "D. 个人利益与集体利益相互独立"], answer: "A" },

                // 模块二：坚定理想信念（20题）
                { module: "模块二：坚定理想信念", number: 21, question: "理想的核心内容是（）", options: ["A. 生活理想", "B. 职业理想", "C. 道德理想", "D. 社会理想"], answer: "D" },
                { module: "模块二：坚定理想信念", number: 22, question: "信念是认知、情感和意志的有机统一体，是人们在一定的认识基础上确立的对某种思想或事物坚信不疑并身体力行的（）", options: ["A. 精神状态", "B. 心理状态", "C. 精神追求", "D. 心理追求"], answer: "A" },
                { module: "模块二：坚定理想信念", number: 23, question: "中国特色社会主义共同理想属于（）", options: ["A. 生活理想", "B. 职业理想", "C. 道德理想", "D. 社会理想"], answer: "D" },

                { module: "模块二：坚定理想信念", number: 15, question: "结合实际，论述理想信念在人生发展中的作用。", referenceAnswer: "答题要点：\n1. 指引人生方向：提供奋斗目标\n2. 提供前进动力：激励人们不断前进\n3. 提高精神境界：塑造高尚品格\n4. 结合实际：如大学生理想信念支撑考研、就业选择等" },
                { module: "模块二：坚定理想信念", number: 16, question: "论述实现理想的长期性、艰巨性和曲折性。", referenceAnswer: "答题要点：\n1. 长期性：理想的实现需要长期奋斗，不是一蹴而就的\n2. 艰巨性：实现过程中会遇到各种困难和挑战\n3. 曲折性：道路不是一帆风顺的，会有挫折和失败\n4. 应对策略：坚定信念、坚持不懈、灵活调整" },
                { module: "模块二：坚定理想信念", number: 17, question: "结合自身实际，论述如何在实践中坚定理想信念。", referenceAnswer: "答题要点：\n1. 加强理论学习：学习马克思主义、中国特色社会主义理论\n2. 投身社会实践：参与社会建设、志愿服务\n3. 自我反思与提升：不断修正认识，坚定信念\n4. 结合大学生实际：如何在学习生活中坚定理想信念" },
                { module: "模块二：坚定理想信念", number: 18, question: "论述个人理想与社会理想的关系及其对人生发展的影响。", referenceAnswer: "答题要点：\n1. 个人理想与社会理想相互依存\n2. 个人理想的实现依赖于社会理想的实现\n3. 社会理想的实现为个人理想的实现提供条件\n4. 个人理想的实现推动社会理想的实现\n5. 对人生发展的影响：指引方向、提供动力" },
                { module: "模块二：坚定理想信念", number: 19, question: "论述理想信念教育的重要性及其实施途径。", referenceAnswer: "答题要点：\n1. 重要性：\n   - 培养合格建设者和接班人的需要\n   - 实现民族复兴的需要\n2. 实施途径：\n   - 学校教育：课程教学、校园文化\n   - 社会宣传：媒体宣传、社会氛围\n   - 个人自觉：主动学习、自我修养" },
                { module: "模块二：坚定理想信念", number: 20, question: "结合实际，论述如何正确对待实现理想过程中的顺境与逆境。", referenceAnswer: "答题要点：\n1. 正确对待顺境：\n   - 不骄傲自满\n   - 抓住机遇提升自己\n2. 正确对待逆境：\n   - 不悲观失望\n   - 磨砺意志，寻找转机\n3. 结合实际：举例说明如何在顺境逆境中坚持理想" },

                // 模块三：弘扬中国精神（10题）
                { module: "模块三：弘扬中国精神", number: 21, question: "论述中国精神的内涵及其重要意义。", referenceAnswer: "答题要点：\n1. 内涵：以爱国主义为核心的民族精神和以改革创新为核心的时代精神\n2. 重要意义：\n   - 是兴国强国之魂\n   - 是实现中国梦的精神动力\n   - 是凝聚中国力量的精神纽带" },
                { module: "模块三：弘扬中国精神", number: 22, question: "论述民族精神的内涵、特征及其重要作用。", referenceAnswer: "答题要点：\n1. 内涵：团结统一、爱好和平、勤劳勇敢、自强不息\n2. 特征：历史性、民族性、稳定性、整体性\n3. 重要作用：\n   - 维护国家统一和民族团结\n   - 推动社会发展进步\n   - 增强民族凝聚力和向心力" },
                { module: "模块三：弘扬中国精神", number: 23, question: "论述时代精神的内涵、特征及其重要作用。", referenceAnswer: "答题要点：\n1. 内涵：解放思想、实事求是、与时俱进、勇于创新\n2. 特征：时代性、先进性、实践性\n3. 重要作用：\n   - 推动改革开放和现代化建设\n   - 激发社会创新活力\n   - 促进国家发展进步" },
                { module: "模块三：弘扬中国精神", number: 24, question: "论述爱国主义的内涵、本质及其重要意义。", referenceAnswer: "答题要点：\n1. 内涵：爱祖国的大好河山、爱自己的骨肉同胞、爱祖国的灿烂文化\n2. 本质：爱国、爱党、爱社会主义高度统一\n3. 重要意义：\n   - 调节个人与祖国关系的行为规范\n   - 维护国家统一和民族团结的精神纽带\n   - 实现中华民族伟大复兴的精神动力" },
                { module: "模块三：弘扬中国精神", number: 25, question: "结合实际，论述如何弘扬爱国主义精神。", referenceAnswer: "答题要点：\n1. 学习和了解祖国历史和文化\n2. 维护国家统一和民族团结\n3. 积极投身祖国建设\n4. 树立民族自尊心和自信心\n5. 结合实际：大学生如何在学习生活中弘扬爱国主义" },
                { module: "模块三：弘扬中国精神", number: 26, question: "论述改革创新精神的内涵及其重要意义。", referenceAnswer: "答题要点：\n1. 内涵：突破陈规、大胆探索、锐意进取、开拓创新\n2. 重要意义：\n   - 是时代发展的要求\n   - 是社会发展的动力\n   - 是个人成才的重要途径\n   - 是国家兴旺发达的不竭动力" },
                { module: "模块三：弘扬中国精神", number: 27, question: "结合实际，论述如何弘扬改革创新精神。", referenceAnswer: "答题要点：\n1. 树立改革创新的自觉意识\n2. 培养改革创新的责任感\n3. 增强改革创新的能力本领\n4. 积极参与创新实践\n5. 结合实际：大学生如何在学习和实践中培养创新精神" },
                { module: "模块三：弘扬中国精神", number: 28, question: "论述中国精神与中国梦的关系。", referenceAnswer: "答题要点：\n1. 中国精神是实现中国梦的强大精神动力\n2. 中国精神是凝聚中国力量的精神纽带\n3. 中国精神是提升综合国力的重要保证\n4. 实现中国梦必须弘扬中国精神" },
                { module: "模块三：弘扬中国精神", number: 29, question: "论述弘扬中国精神的实践途径。", referenceAnswer: "答题要点：\n1. 加强理论学习：学习中国精神的内涵和意义\n2. 积极参与社会实践：在实践中弘扬中国精神\n3. 传承和弘扬中华优秀传统文化\n4. 向先进典型学习\n5. 从自身做起，从小事做起" },
                { module: "模块三：弘扬中国精神", number: 30, question: "结合实际，论述如何在新时代弘扬中国精神。", referenceAnswer: "答题要点：\n1. 坚持爱国主义与社会主义相统一\n2. 坚持民族精神与时代精神相结合\n3. 在实现中国梦的实践中弘扬中国精神\n4. 结合新时代特点：如科技创新、脱贫攻坚等" },

                // 模块四：践行社会主义核心价值观（10题）
                { module: "模块四：践行社会主义核心价值观", number: 31, question: "论述社会主义核心价值观的内涵及其重要意义。", referenceAnswer: "答题要点：\n1. 内涵：富强、民主、文明、和谐（国家层面）；自由、平等、公正、法治（社会层面）；爱国、敬业、诚信、友善（公民层面）\n2. 重要意义：\n   - 坚持和发展中国特色社会主义的价值遵循\n   - 提高国家文化软实力的迫切要求\n   - 增进社会团结和谐的最大公约数" },
                { module: "模块四：践行社会主义核心价值观", number: 32, question: "论述社会主义核心价值观的基本特征。", referenceAnswer: "答题要点：\n1. 先进性：反映人类社会发展进步方向\n2. 人民性：体现最广大人民的根本利益\n3. 真实性：实事求是，符合中国实际\n4. 实践性：来源于实践，指导实践" },
                { module: "模块四：践行社会主义核心价值观", number: 33, question: "论述社会主义核心价值观与社会主义核心价值体系的关系。", referenceAnswer: "答题要点：\n1. 社会主义核心价值观是社会主义核心价值体系的内核\n2. 社会主义核心价值体系是社会主义核心价值观的基础\n3. 两者相互联系、相互促进\n4. 社会主义核心价值观体现社会主义核心价值体系的根本性质和基本特征" },
                { module: "模块四：践行社会主义核心价值观", number: 34, question: "论述培育和践行社会主义核心价值观的重要意义。", referenceAnswer: "答题要点：\n1. 是坚持和发展中国特色社会主义的价值遵循\n2. 是提高国家文化软实力的迫切要求\n3. 是增进社会团结和谐的最大公约数\n4. 是国家长治久安的重要保障" },
                { module: "模块四：践行社会主义核心价值观", number: 35, question: "论述如何培育和践行社会主义核心价值观。", referenceAnswer: "答题要点：\n1. 勤学：下得苦功夫，求得真学问\n2. 修德：加强道德修养，注重道德实践\n3. 明辨：善于明辨是非，善于决断选择\n4. 笃实：扎扎实实干事，踏踏实实做人" },
                { module: "模块四：践行社会主义核心价值观", number: 36, question: "论述社会主义核心价值观与中华优秀传统文化的关系。", referenceAnswer: "答题要点：\n1. 社会主义核心价值观是对中华优秀传统文化的继承和发展\n2. 中华优秀传统文化是社会主义核心价值观的重要源泉\n3. 两者相互促进、相互推动\n4. 培育和践行社会主义核心价值观需要传承和弘扬中华优秀传统文化" },
                { module: "模块四：践行社会主义核心价值观", number: 37, question: "结合自身实际，论述大学生如何践行社会主义核心价值观。", referenceAnswer: "答题要点：\n1. 认真学习，深入理解社会主义核心价值观的内涵\n2. 从小事做起，从身边做起\n3. 在学习生活中践行：爱国、敬业、诚信、友善\n4. 积极参与社会实践，传播正能量\n5. 结合大学生实际举例" },
                { module: "模块四：践行社会主义核心价值观", number: 38, question: "论述社会主义核心价值观的道义力量。", referenceAnswer: "答题要点：\n1. 先进性：体现社会发展进步方向，具有引领作用\n2. 人民性：反映人民根本利益，得到人民广泛认同\n3. 真实性：实事求是，符合中国实际，具有说服力\n4. 道义力量是社会主义核心价值观的重要优势" },
                { module: "模块四：践行社会主义核心价值观", number: 39, question: "论述培育和践行社会主义核心价值观的实践途径。", referenceAnswer: "答题要点：\n1. 融入教育全过程：学校教育、家庭教育、社会教育\n2. 融入经济社会发展实践\n3. 融入文化建设\n4. 融入法律法规和政策\n5. 融入人们日常生活" },
                { module: "模块四：践行社会主义核心价值观", number: 40, question: "论述社会主义核心价值观在实现中国梦中的作用。", referenceAnswer: "答题要点：\n1. 为实现中国梦提供价值引领\n2. 为实现中国梦凝聚精神力量\n3. 为实现中国梦提供道德支撑\n4. 为实现中国梦提供文化基础" },

                // 模块五：遵守道德规范 锤炼道德品格（10题）
                { module: "模块五：遵守道德规范", number: 41, question: "论述道德的本质、功能及其作用。", referenceAnswer: "答题要点：\n1. 本质：一种社会意识形态、一种特殊的规范体系、一种实践精神\n2. 功能：认识功能、规范功能、调节功能\n3. 作用：\n   - 维护社会秩序\n   - 促进社会发展\n   - 提升个人品德\n   - 协调人际关系" },
                { module: "模块五：遵守道德规范", number: 42, question: "论述社会主义道德的核心和原则及其重要意义。", referenceAnswer: "答题要点：\n1. 核心：为人民服务\n2. 原则：集体主义\n3. 重要意义：\n   - 体现社会主义制度的优越性\n   - 调节社会利益关系\n   - 促进社会和谐发展\n   - 提升公民道德素质" },
                { module: "模块五：遵守道德规范", number: 43, question: "论述社会主义道德建设与中华民族传统美德的关系。", referenceAnswer: "答题要点：\n1. 中华民族传统美德是社会主义道德的重要源泉\n2. 社会主义道德是对中华民族传统美德的继承和发展\n3. 两者相互促进、相互推动\n4. 社会主义道德建设需要传承和弘扬中华民族传统美德" },
                { module: "模块五：遵守道德规范", number: 44, question: "论述社会公德、职业道德、家庭美德和个人品德的主要内容及其重要意义。", referenceAnswer: "答题要点：\n1. 社会公德：文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法\n2. 职业道德：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会\n3. 家庭美德：尊老爱幼、男女平等、夫妻和睦、勤俭持家、邻里团结\n4. 个人品德：道德认知、道德情感、道德意志、道德行为\n5. 重要意义：构建和谐社会、促进个人全面发展" },
                { module: "模块五：遵守道德规范", number: 45, question: "结合自身实际，论述如何提高个人品德修养。", referenceAnswer: "答题要点：\n1. 认真学习，提高道德认识\n2. 勤于实践，加强道德行为训练\n3. 严格要求，完善道德品质\n4. 自觉向道德模范学习\n5. 结合大学生实际：在学习生活中如何提升个人品德" },
                { module: "模块五：遵守道德规范", number: 46, question: "论述道德与法律的关系。", referenceAnswer: "答题要点：\n1. 道德与法律是相互统一的\n2. 道德是法律的基础：法律体现道德精神，道德支持法律实施\n3. 法律是道德的保障：法律保障道德实施，法律强化道德约束\n4. 道德与法律相互促进、相互补充\n5. 坚持依法治国和以德治国相结合" },
                { module: "模块五：遵守道德规范", number: 47, question: "论述如何践行社会主义道德。", referenceAnswer: "答题要点：\n1. 树立正确的道德观念\n2. 自觉遵守道德规范\n3. 积极参与道德实践\n4. 向道德模范学习\n5. 加强道德修养，提升道德境界" },
                { module: "模块五：遵守道德规范", number: 48, question: "论述公民基本道德规范的主要内容及其重要意义。", referenceAnswer: "答题要点：\n1. 主要内容：爱国守法、明礼诚信、团结友善、勤俭自强、敬业奉献\n2. 重要意义：\n   - 提高公民道德素质\n   - 促进社会和谐发展\n   - 推动精神文明建设\n   - 构建社会主义和谐社会" },
                { module: "模块五：遵守道德规范", number: 49, question: "结合实际，论述如何弘扬中华民族传统美德。", referenceAnswer: "答题要点：\n1. 学习和了解中华民族传统美德\n2. 在日常生活中践行传统美德\n3. 向道德模范学习\n4. 结合实际：大学生如何在学习生活中弘扬传统美德" },
                { module: "模块五：遵守道德规范", number: 50, question: "论述道德修养的方法和途径。", referenceAnswer: "答题要点：\n1. 学习道德理论\n2. 参与道德实践\n3. 向道德模范学习\n4. 加强自我修养\n5. 知行合一，注重实践" },

                // 模块六：尊法学法守法用法（10题）
                { module: "模块六：尊法学法守法用法", number: 51, question: "论述法律的内涵、特征及其作用。", referenceAnswer: "答题要点：\n1. 内涵：由国家制定或认可并由国家强制力保证实施的行为规范体系\n2. 特征：国家意志性、国家强制性、规范性、普遍性、程序性\n3. 作用：\n   - 规范社会行为\n   - 维护社会秩序\n   - 保障公民权利\n   - 推动社会发展" },
                { module: "模块六：尊法学法守法用法", number: 52, question: "论述我国宪法的基本原则及其重要意义。", referenceAnswer: "答题要点：\n1. 基本原则：\n   - 人民主权原则\n   - 基本人权原则\n   - 法治原则\n   - 权力制约原则\n2. 重要意义：\n   - 保障公民权利\n   - 规范国家权力\n   - 维护国家统一\n   - 促进社会和谐" },
                { module: "模块六：尊法学法守法用法", number: 53, question: "论述中国特色社会主义法律体系的构成及其重要意义。", referenceAnswer: "答题要点：\n1. 构成：宪法及宪法相关法、民法商法、行政法、经济法、社会法、刑法、诉讼与非诉讼程序法\n2. 重要意义：\n   - 是中国特色社会主义永葆本色的法制根基\n   - 是中国特色社会主义创新实践的法制体现\n   - 是中国特色社会主义兴旺发达的法制保障" },
                { module: "模块六：尊法学法守法用法", number: 54, question: "论述法治思维的基本内涵及其培养途径。", referenceAnswer: "答题要点：\n1. 基本内涵：\n   - 法律至上\n   - 权力制约\n   - 公平正义\n   - 人权保障\n   - 正当程序\n2. 培养途径：\n   - 学习法律知识\n   - 掌握法律方法\n   - 参与法律实践\n   - 养成法治习惯" },
                { module: "模块六：尊法学法守法用法", number: 55, question: "论述法律权利与法律义务的关系。", referenceAnswer: "答题要点：\n1. 相互依存：权利的实现需要义务的履行，义务的履行促进权利的实现\n2. 目的与手段：权利是目的，义务是手段\n3. 二重性：既享有权利，又履行义务\n4. 二者统一于法律关系之中" },
                { module: "模块六：尊法学法守法用法", number: 56, question: "论述依法治国的重要意义及其基本要求。", referenceAnswer: "答题要点：\n1. 重要意义：\n   - 是党领导人民治理国家的基本方略\n   - 是实现国家治理体系和治理能力现代化的必然要求\n   - 是实现中华民族伟大复兴的重要保障\n2. 基本要求：\n   - 科学立法\n   - 严格执法\n   - 公正司法\n   - 全民守法" },
                { module: "模块六：尊法学法守法用法", number: 57, question: "论述如何培养法治思维。", referenceAnswer: "答题要点：\n1. 学习法律知识：掌握基本法律原理和法律规定\n2. 掌握法律方法：学会运用法律分析和解决问题\n3. 参与法律实践：在实践中培养法治思维\n4. 养成法治习惯：自觉用法治思维思考问题\n5. 增强法治意识：树立法律信仰" },
                { module: "模块六：尊法学法守法用法", number: 58, question: "论述法治与德治的关系。", referenceAnswer: "答题要点：\n1. 法治与德治是相互统一的\n2. 法治是德治的保障：法律保障道德实施\n3. 德治是法治的基础：道德支持法律实施\n4. 法治与德治相互促进、相互补充\n5. 坚持依法治国和以德治国相结合" },
                { module: "模块六：尊法学法守法用法", number: 59, question: "结合自身实际，论述大学生如何尊法学法守法用法。", referenceAnswer: "答题要点：\n1. 尊法：树立法律信仰，尊重法律权威\n2. 学法：学习法律知识，提高法律素养\n3. 守法：自觉遵守法律，依法办事\n4. 用法：运用法律维护权益，解决问题\n5. 结合大学生实际：在学习生活中如何做到尊法学法守法用法" },
                { module: "模块六：尊法学法守法用法", number: 60, question: "论述法律权威的内涵及其树立途径。", referenceAnswer: "答题要点：\n1. 内涵：法律的内在说服力和外在强制力的统一\n2. 树立途径：\n   - 提高立法质量\n   - 严格执法公正司法\n   - 加强法制宣传教育\n   - 全社会共同努力\n   - 培养公民法律信仰" },

                // 模块七：宪法是国家的根本大法（10题）
                { module: "模块七：宪法是国家的根本大法", number: 61, question: "论述宪法的核心价值及其重要意义。", referenceAnswer: "答题要点：\n1. 核心价值：保障公民权利\n2. 重要意义：\n   - 限制国家权力，防止权力滥用\n   - 维护国家统一和民族团结\n   - 促进社会和谐稳定\n   - 保障公民基本权利和自由" },
                { module: "模块七：宪法是国家的根本大法", number: 62, question: "论述我国宪法的基本原则及其主要内容。", referenceAnswer: "答题要点：\n1. 人民主权原则：国家一切权力属于人民\n2. 基本人权原则：保障公民基本权利\n3. 法治原则：实行依法治国，建设社会主义法治国家\n4. 权力制约原则：国家机构实行民主集中制" },
                { module: "模块七：宪法是国家的根本大法", number: 63, question: "论述宪法与普通法律的关系。", referenceAnswer: "答题要点：\n1. 宪法是普通法律的立法基础和立法依据\n2. 普通法律是宪法的具体化\n3. 宪法的法律效力高于普通法律\n4. 普通法律不得与宪法相抵触\n5. 宪法是根本法，具有最高法律效力" },
                { module: "模块七：宪法是国家的根本大法", number: 64, question: "论述我国宪法规定的公民基本权利和义务。", referenceAnswer: "答题要点：\n1. 基本权利：\n   - 平等权\n   - 政治权利和自由\n   - 宗教信仰自由\n   - 人身自由\n   - 社会经济权利\n   - 文化教育权利\n2. 基本义务：\n   - 维护国家统一和民族团结\n   - 遵守宪法和法律\n   - 维护祖国安全、荣誉和利益\n   - 依法服兵役\n   - 依法纳税" },
                { module: "模块七：宪法是国家的根本大法", number: 65, question: "论述宪法的实施及其保障机制。", referenceAnswer: "答题要点：\n1. 宪法实施：宪法规范在现实生活中的贯彻落实\n2. 保障机制：\n   - 宪法监督：全国人大及其常委会监督宪法实施\n   - 宪法解释：全国人大常委会解释宪法\n   - 违宪审查：审查法律法规是否合宪\n   - 宪法宣传：加强宪法宣传教育" },
                { module: "模块七：宪法是国家的根本大法", number: 66, question: "论述我国宪法的历史发展及其重要意义。", referenceAnswer: "答题要点：\n1. 历史发展：1954年、1975年、1978年、1982年宪法\n2. 1982年宪法的五次修正\n3. 重要意义：\n   - 确立了国家的根本制度和根本任务\n   - 保障了公民的基本权利\n   - 规范了国家权力的运行\n   - 为国家发展提供了法制保障" },
                { module: "模块七：宪法是国家的根本大法", number: 67, question: "论述如何维护宪法权威。", referenceAnswer: "答题要点：\n1. 学习宪法：掌握宪法基本知识和精神\n2. 遵守宪法：自觉遵守宪法规定\n3. 执行宪法：严格按照宪法办事\n4. 维护宪法：同违反宪法的行为作斗争\n5. 加强宪法宣传教育" },
                { module: "模块七：宪法是国家的根本大法", number: 68, question: "论述我国国家机构的组织和活动原则。", referenceAnswer: "答题要点：\n1. 民主集中制原则\n2. 法治原则\n3. 联系群众、为人民服务原则\n4. 责任制原则\n5. 精简和效率原则" },
                { module: "模块七：宪法是国家的根本大法", number: 69, question: "结合实际，论述大学生如何增强宪法意识。", referenceAnswer: "答题要点：\n1. 学习宪法知识，理解宪法精神\n2. 树立宪法信仰，维护宪法权威\n3. 自觉遵守宪法，依法行使权利和履行义务\n4. 积极宣传宪法，传播宪法理念\n5. 同违反宪法的行为作斗争\n6. 结合大学生实际举例" },
                { module: "模块七：宪法是国家的根本大法", number: 70, question: "论述宪法在国家治理体系中的地位和作用。", referenceAnswer: "答题要点：\n1. 地位：\n   - 国家的根本大法\n   - 治国安邦的总章程\n   - 具有最高法律效力\n2. 作用：\n   - 确认国家根本制度\n   - 保障公民基本权利\n   - 规范国家权力运行\n   - 维护国家统一和稳定" },

                // 模块八：中国特色社会主义法律体系（10题）
                { module: "模块八：中国特色社会主义法律体系", number: 71, question: "论述中国特色社会主义法律体系的构成及其特征。", referenceAnswer: "答题要点：\n1. 构成：宪法及宪法相关法、民法商法、行政法、经济法、社会法、刑法、诉讼与非诉讼程序法\n2. 特征：\n   - 体现了中国特色社会主义的本质要求\n   - 体现了改革开放和社会主义现代化建设的时代要求\n   - 体现了结构内在统一而又多层次的国情要求" },
                { module: "模块八：中国特色社会主义法律体系", number: 72, question: "论述民法商法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：民法典、公司法、证券法、票据法等\n2. 作用：\n   - 调整平等主体之间的财产关系和人身关系\n   - 保护民事主体的合法权益\n   - 维护社会经济秩序\n   - 促进社会主义市场经济健康发展" },
                { module: "模块八：中国特色社会主义法律体系", number: 73, question: "论述行政法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：行政许可法、行政处罚法、行政复议法、行政诉讼法等\n2. 作用：\n   - 调整行政机关与公民、法人和其他组织之间的关系\n   - 规范行政行为\n   - 保护行政相对人的合法权益\n   - 促进依法行政" },
                { module: "模块八：中国特色社会主义法律体系", number: 74, question: "论述经济法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：反不正当竞争法、消费者权益保护法、产品质量法、预算法等\n2. 作用：\n   - 调整国家在管理和协调经济运行过程中发生的经济关系\n   - 维护市场经济秩序\n   - 保护经营者和消费者的合法权益\n   - 促进经济健康发展" },
                { module: "模块八：中国特色社会主义法律体系", number: 75, question: "论述社会法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：劳动法、劳动合同法、社会保险法、残疾人保障法等\n2. 作用：\n   - 调整劳动关系、社会保障关系和社会福利关系\n   - 保护劳动者和社会弱势群体的合法权益\n   - 维护社会公平正义\n   - 促进社会和谐稳定" },
                { module: "模块八：中国特色社会主义法律体系", number: 76, question: "论述刑法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：刑法、刑事诉讼法等\n2. 作用：\n   - 规定犯罪和刑罚\n3. 惩罚犯罪，保护人民\n   - 维护社会秩序\n   - 保障国家安全" },
                { module: "模块八：中国特色社会主义法律体系", number: 77, question: "论述诉讼与非诉讼程序法部门的主要内容及其作用。", referenceAnswer: "答题要点：\n1. 主要内容：民事诉讼法、行政诉讼法、仲裁法等\n2. 作用：\n   - 规范解决社会纠纷的诉讼活动与非诉讼活动\n   - 保证公正及时地解决纠纷\n   - 保护当事人的合法权益\n   - 维护社会秩序" },
                { module: "模块八：中国特色社会主义法律体系", number: 78, question: "论述完善中国特色社会主义法律体系的重要意义。", referenceAnswer: "答题要点：\n1. 是建设社会主义法治国家的重要基础\n2. 是实现国家治理体系和治理能力现代化的必然要求\n3. 是全面深化改革的法制保障\n4. 是保障和改善民生的重要手段\n5. 是维护社会和谐稳定的重要基础" },
                { module: "模块八：中国特色社会主义法律体系", number: 79, question: "论述中国特色社会主义法律体系的形成过程及其重要意义。", referenceAnswer: "答题要点：\n1. 形成过程：改革开放以来逐步形成和完善\n2. 重要意义：\n   - 标志着社会主义法治建设进入新阶段\n   - 为中国特色社会主义事业提供法制保障\n   - 是国家法治建设的重要里程碑" },
                { module: "模块八：中国特色社会主义法律体系", number: 80, question: "结合实际，论述如何完善中国特色社会主义法律体系。", referenceAnswer: "答题要点：\n1. 坚持科学立法、民主立法、依法立法\n2. 完善立法体制，提高立法质量\n3. 加强重点领域立法\n4. 适应改革发展需要，及时制定和修改法律\n5. 增强法律法规的及时性、系统性、针对性、有效性\n6. 结合实际举例" },

                // 模块九：法治中国建设（10题）
                { module: "模块九：法治中国建设", number: 81, question: "论述法治中国建设的总目标及其主要内容。", referenceAnswer: "答题要点：\n1. 总目标：建设中国特色社会主义法治体系，建设社会主义法治国家\n2. 主要内容：\n   - 完备的法律规范体系\n   - 高效的法治实施体系\n   - 严密的法治监督体系\n   - 有力的法治保障体系\n   - 完善的党内法规体系" },
                { module: "模块九：法治中国建设", number: 82, question: "论述法治中国建设的基本原则。", referenceAnswer: "答题要点：\n1. 坚持党的领导\n2. 坚持人民主体地位\n3. 坚持法律面前人人平等\n4. 坚持依法治国和以德治国相结合\n5. 坚持从中国实际出发" },
                { module: "模块九：法治中国建设", number: 83, question: "论述建设法治政府的重要意义及其主要任务。", referenceAnswer: "答题要点：\n1. 重要意义：\n   - 是全面依法治国的重点任务和主体工程\n   - 是实现国家治理体系和治理能力现代化的重要保障\n2. 主要任务：\n   - 依法全面履行政府职能\n   - 健全依法决策机制\n   - 深化行政执法体制改革\n   - 坚持严格规范公正文明执法\n   - 强化对行政权力的制约和监督" },
                { module: "模块九：法治中国建设", number: 84, question: "论述公正司法的内涵及其实现途径。", referenceAnswer: "答题要点：\n1. 内涵：司法公正、司法高效、司法权威\n2. 实现途径：\n   - 完善司法管理体制和司法权力运行机制\n   - 规范司法行为\n   - 加强对司法活动的监督\n   - 保障人民群众参与司法\n   - 加强司法队伍建设" },
                { module: "模块九：法治中国建设", number: 85, question: "论述全民守法的重要意义及其实现途径。", referenceAnswer: "答题要点：\n1. 重要意义：\n   - 是建设法治国家的基础\n   - 是实现社会和谐稳定的重要保障\n2. 实现途径：\n   - 深入开展法治宣传教育\n   - 健全普法宣传教育机制\n   - 建设完备的法律服务体系\n   - 健全依法维权和化解纠纷机制" },
                { module: "模块九：法治中国建设", number: 86, question: "论述党的领导与依法治国的关系。", referenceAnswer: "答题要点：\n1. 党的领导是中国特色社会主义最本质的特征\n2. 党的领导是社会主义法治最根本的保证\n3. 依法治国是党领导人民治理国家的基本方略\n4. 党的领导必须依靠社会主义法治\n5. 坚持党的领导、人民当家作主、依法治国有机统一" },
                { module: "模块九：法治中国建设", number: 87, question: "论述法治中国建设与实现中国梦的关系。", referenceAnswer: "答题要点：\n1. 法治中国建设是实现中国梦的重要保障\n2. 法治为中国梦提供制度保障\n3. 法治为中国梦提供稳定环境\n4. 法治为中国梦提供公平正义\n5. 实现中国梦必须全面推进法治中国建设" },
                { module: "模块九：法治中国建设", number: 88, question: "论述法治中国建设的重点任务。", referenceAnswer: "答题要点：\n1. 完善以宪法为核心的中国特色社会主义法律体系\n2. 深入推进依法行政，加快建设法治政府\n3. 保证公正司法，提高司法公信力\n4. 增强全民法治观念，推进法治社会建设\n5. 加强法治工作队伍建设" },
                { module: "模块九：法治中国建设", number: 89, question: "结合实际，论述大学生如何参与法治中国建设。", referenceAnswer: "答题要点：\n1. 学习法律知识，提高法律素养\n2. 树立法治意识，培养法治思维\n3. 自觉遵守法律，依法办事\n4. 运用法律维护权益，解决问题\n5. 积极参与法治实践\n6. 宣传法治理念，传播法治文化\n7. 结合大学生实际举例" },
                { module: "模块九：法治中国建设", number: 90, question: "论述法治中国建设的长期性、复杂性和艰巨性。", referenceAnswer: "答题要点：\n1. 长期性：法治建设是一个长期过程，需要长期努力\n2. 复杂性：涉及方方面面，需要统筹协调\n3. 艰巨性：面临各种挑战和困难\n4. 应对策略：\n   - 坚定信心，坚持不懈\n   - 统筹规划，稳步推进\n   - 攻坚克难，勇于创新\n   - 全社会共同参与" },

                // 模块十：综合知识点（10题）
                { module: "模块十：综合知识点", number: 91, question: "论述世界观、人生观、价值观的相互关系。", referenceAnswer: "答题要点：\n1. 世界观决定人生观，人生观反作用于世界观\n2. 人生观决定价值观，价值观体现人生观\n3. 三者相互联系、相互制约\n4. 树立正确的世界观、人生观、价值观对人生发展具有重要意义" },
                { module: "模块十：综合知识点", number: 92, question: "论述理想信念与中国梦的关系。", referenceAnswer: "答题要点：\n1. 理想信念是实现中国梦的精神动力\n2. 中国梦是理想信念的具体体现\n3. 坚定理想信念，才能为实现中国梦而奋斗\n4. 实现中国梦需要坚定理想信念支撑" },
                { module: "模块十：综合知识点", number: 93, question: "论述中国精神、社会主义核心价值观、法治中国建设的内在联系。", referenceAnswer: "答题要点：\n1. 中国精神是民族精神和时代精神的统一\n2. 社会主义核心价值观是中国精神的集中体现\n3. 法治中国建设需要弘扬中国精神和践行社会主义核心价值观\n4. 三者相互促进、相互推动，共同推进中国特色社会主义事业" },
                { module: "模块十：综合知识点", number: 94, question: "论述道德建设与法治建设的关系。", referenceAnswer: "答题要点：\n1. 道德与法律是相互统一的\n2. 道德是法律的基础，法律是道德的保障\n3. 道德建设与法治建设相辅相成\n4. 坚持依法治国和以德治国相结合\n5. 推动社会治理现代化" },
                { module: "模块十：综合知识点", number: 95, question: "论述个人成长与社会发展的关系。", referenceAnswer: "答题要点：\n1. 个人成长离不开社会发展\n2. 社会发展需要个人贡献力量\n3. 个人成长与社会发展相互促进\n4. 在实现社会发展中实现个人价值\n5. 在贡献社会中促进个人成长" },
                { module: "模块十：综合知识点", number: 96, question: "论述新时代青年的使命与担当。", referenceAnswer: "答题要点：\n1. 坚定理想信念，树立正确的世界观、人生观、价值观\n2. 弘扬中国精神，践行社会主义核心价值观\n3. 练就过硬本领，提高综合素质\n4. 勇于创新创造，投身改革开放\n5. 矢志艰苦奋斗，传承优良传统\n6. 锤炼高尚品格，引领社会风尚" },
                { module: "模块十：综合知识点", number: 97, question: "论述如何做一名新时代合格的大学生。", referenceAnswer: "答题要点：\n1. 坚定理想信念，树立正确的三观\n2. 弘扬中国精神，践行社会主义核心价值观\n3. 遵守道德规范，提高道德修养\n4. 学习法律知识，增强法治意识\n5. 练就过硬本领，提高综合素质\n6. 投身社会实践，服务人民群众\n7. 勇于担当作为，贡献青春力量" },
                { module: "模块十：综合知识点", number: 98, question: "论述坚持中国特色社会主义道路自信、理论自信、制度自信、文化自信的重要意义。", referenceAnswer: "答题要点：\n1. 道路自信：坚持中国特色社会主义道路\n2. 理论自信：坚持中国特色社会主义理论体系\n3. 制度自信：坚持中国特色社会主义制度\n4. 文化自信：坚持中国特色社会主义文化\n5. 四个自信相互促进、相互支撑，共同推动中国特色社会主义事业" },
                { module: "模块十：综合知识点", number: 99, question: "论述实现中华民族伟大复兴的中国梦与青年一代的责任。", referenceAnswer: "答题要点：\n1. 中国梦是国家的梦、民族的梦，也是每个中国人的梦\n2. 青年是实现中国梦的生力军\n3. 青年一代的责任：\n   - 坚定理想信念\n   - 练就过硬本领\n   - 勇于创新创造\n   - 矢志艰苦奋斗\n   - 锤炼高尚品格\n4. 在实现中国梦的生动实践中放飞青春梦想" },
                { module: "模块十：综合知识点", number: 100, question: "结合自身实际，论述如何在新时代做一名有理想、有本领、有担当的青年。", referenceAnswer: "答题要点：\n1. 有理想：\n   - 坚定理想信念\n   - 树立正确的世界观、人生观、价值观\n   - 把个人理想融入国家和民族的事业中\n2. 有本领：\n   - 学习科学文化知识\n   - 掌握专业技能\n   - 提高综合素质\n   - 培养创新精神\n3. 有担当：\n   - 勇于承担社会责任\n   - 投身社会实践\n   - 为国家和人民作贡献\n4. 结合自身实际举例说明" },

                // 真题补充论述题
                { module: "模块一：领悟人生真谛", number: 101, question: "论述新时代大学生如何在实践中创造有价值的人生。", referenceAnswer: "答题要点：\n1. 从社会客观条件出发，把握时代发展机遇，顺应社会发展规律\n2. 从个体自身条件出发，认识自己的优势和不足，不断提升自身能力和本领\n3. 立足本职岗位，脚踏实地，埋头苦干，在平凡的岗位上创造不平凡的业绩\n4. 投身社会实践，积极参与志愿服务、社会公益等活动，为社会和他人贡献力量\n5. 正确对待人生道路上的顺境与逆境，顺境中不骄傲自满，逆境中不悲观失望，磨砺意志，增长才干" },
                { module: "模块六：尊法学法守法用法", number: 102, question: "论述新时代大学生如何尊法学法守法用法，树立法治思维。", referenceAnswer: "答题要点：\n1. 尊法：树立法律至上的理念，尊重法律的权威，维护法律的尊严\n2. 学法：学习法律知识，掌握法律原则和法律方法，了解自身的权利和义务\n3. 守法：自觉遵守法律，依法履行义务，不做违法犯罪的事情\n4. 用法：运用法律武器维护自身合法权益，维护社会公平正义\n5. 树立法治思维：培养法律至上、权力制约、公平正义、权利保障等法治思维，用法治方式思考和处理问题" },
                { module: "模块一：领悟人生真谛", number: 103, question: "简述人生价值的评价标准。", referenceAnswer: "答题要点：\n1. 根本尺度：看一个人的人生活动是否符合社会发展的客观规律，是否通过实践促进了历史的进步\n2. 基本尺度：看个人对社会和他人的贡献，包括物质贡献和精神贡献\n3. 补充尺度：社会对个人的尊重和满足，以及个人的自我实现" },
                { module: "模块二：坚定理想信念", number: 104, question: "简述理想信念的作用。", referenceAnswer: "答题要点：\n1. 指引人生的奋斗目标，为人们指明前进方向\n2. 提供人生的前进动力，激励人们克服困难\n3. 提高人生的精神境界，丰富人们的精神世界" },
                { module: "模块五：遵守道德规范", number: 105, question: "简述道德与法律的区别。", referenceAnswer: "答题要点：\n1. 产生方式不同：道德是自发形成的，法律是由国家制定或认可的\n2. 表现形式不同：道德存在于人们的意识和社会舆论中，法律以规范性文件形式存在\n3. 调整范围不同：道德调整的范围更广泛，法律调整的是具有严重社会危害性的行为\n4. 实施保障不同：道德靠社会舆论、传统习俗和内心信念保障，法律靠国家强制力保障" },
                { module: "模块四：践行社会主义核心价值观", number: 106, question: "简述社会主义核心价值观的三个层面内容。", referenceAnswer: "答题要点：\n1. 国家层面：富强、民主、文明、和谐\n2. 社会层面：自由、平等、公正、法治\n3. 公民层面：爱国、敬业、诚信、友善" },
                { module: "模块一：领悟人生真谛", number: 107, question: "简述人生观的主要内容。", referenceAnswer: "答题要点：\n1. 人生观的主要内容包括人生目的、人生态度和人生价值三个方面\n2. 人生目的是指人为什么活着，是人生观的核心\n3. 人生态度是指人们通过生活实践形成的对人生问题的一种稳定的心理倾向和基本意愿\n4. 人生价值是指人的生命及其实践活动对于社会和个人所具有的作用和意义" },
                { module: "模块三：弘扬中国精神", number: 108, question: "简述中国精神的内涵。", referenceAnswer: "答题要点：\n1. 中国精神包括民族精神和时代精神两部分\n2. 民族精神是一个民族在长期共同生活和社会实践中形成的，为本民族大多数成员所认同的价值取向、思维方式、道德规范、精神气质的总和，其核心是爱国主义\n3. 时代精神是一个国家和民族在新的历史条件下形成和发展的，是体现民族特质并顺应时代潮流的思想观念、价值取向、精神风貌和社会风尚的总和，其核心是改革创新" },
                { module: "模块二：坚定理想信念", number: 109, question: "论述新时代大学生如何坚定理想信念，做有理想、有本领、有担当的时代新人。", referenceAnswer: "答题要点：\n1. 坚定理想信念，树立远大理想。新时代大学生要树立中国特色社会主义共同理想和共产主义远大理想，把个人的理想追求与国家和民族的命运紧密结合起来\n2. 努力学习科学文化知识，提升自身本领。新时代大学生要勤奋学习，刻苦钻研，掌握扎实的专业知识和技能，提高自身的综合素质和能力\n3. 增强社会责任感，勇于担当时代使命。新时代大学生要关注社会热点问题，积极参与社会实践，为社会和他人贡献力量，在实现中华民族伟大复兴的中国梦中贡献自己的青春和力量\n4. 加强道德修养，锤炼道德品格。新时代大学生要树立正确的道德观，践行社会主义核心价值观，培养良好的道德品质和行为习惯\n5. 树立法治观念，增强法治意识。新时代大学生要学习法律知识，树立法治思维，自觉遵守法律，依法履行义务，维护法律的权威和尊严" },
                { module: "模块五：遵守道德规范", number: 110, question: "论述道德与法律的关系，以及如何坚持依法治国和以德治国相结合。", referenceAnswer: "答题要点：\n1. 道德与法律的关系：\n   - 区别：产生方式不同、表现形式不同、调整范围不同、实施保障不同\n   - 联系：道德与法律相辅相成、相互促进。道德是法律的基础，为法律的制定提供价值导向，为法律的实施提供精神支持；法律是道德的保障，通过强制力保障道德的实施，促进道德的发展\n2. 坚持依法治国和以德治国相结合的途径：\n   - 强化道德对法治的支撑作用。重视道德教育，提高全社会的道德水平，为法治建设提供良好的社会环境；把道德要求融入法律规范，使法律更加体现道德的要求\n   - 强化法律对道德建设的促进作用。通过法律的强制力，保障道德的实施，对违反道德的行为进行制裁；通过法律的引导作用，促进全社会道德水平的提高\n   - 坚持依法治国和以德治国相结合，必须坚持党的领导，发挥党总揽全局、协调各方的领导核心作用；必须坚持以人民为中心，保障人民的根本利益；必须坚持从中国实际出发，结合中国的历史文化和现实国情，推进依法治国和以德治国相结合" },
                { module: "模块三：弘扬中国精神", number: 111, question: "论述新时代大学生如何弘扬中国精神，做新时代的爱国者。", referenceAnswer: "答题要点：\n1. 弘扬民族精神，增强爱国情感。新时代大学生要弘扬以爱国主义为核心的民族精神，增强对祖国的认同感、归属感和自豪感，树立爱国情怀\n2. 弘扬时代精神，增强创新意识。新时代大学生要弘扬以改革创新为核心的时代精神，增强创新意识和创新能力，积极投身改革创新的实践中\n3. 维护国家统一和民族团结。新时代大学生要自觉维护国家领土完整和民族团结，反对分裂国家和破坏民族团结的行为\n4. 增强国家安全意识。新时代大学生要增强国家安全意识，自觉维护国家的安全、荣誉和利益，保守国家秘密\n5. 立足本职，报效祖国。新时代大学生要努力学习科学文化知识，提升自身能力和本领，毕业后立足本职岗位，为国家的发展和民族的复兴贡献自己的力量" },
                { module: "模块五：遵守道德规范", number: 112, question: "简述社会主义道德的原则。", referenceAnswer: "答题要点：\n1. 社会主义道德的原则是集体主义\n2. 集体主义强调集体利益高于个人利益，在集体利益和个人利益发生矛盾时，个人利益要服从集体利益\n3. 同时，集体主义也重视和保障个人的正当利益，促进个人的全面发展\n4. 集体主义分为三个层次：\n   - 无私奉献、一心为公的最高层次\n   - 先公后私、先人后己的中间层次\n   - 顾全大局、遵纪守法、热爱祖国、诚实劳动的基本层次" },
                { module: "模块六：尊法学法守法用法", number: 113, question: "简述法治思维的基本内容。", referenceAnswer: "答题要点：\n1. 法律至上，强调法律是最高的权威，任何组织和个人都必须在法律范围内活动\n2. 权力制约，强调权力必须受到法律的制约和监督，防止权力滥用\n3. 公平正义，强调法律面前人人平等，维护社会的公平正义\n4. 权利保障，强调法律要保障公民的基本权利和自由\n5. 正当程序，强调法律的运行必须遵循正当的程序，保证程序的公正" }
            ]
        };

        // 全局变量
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let selectedAnswer = null;
        let selectedModules = [];
        let quizProgress = {
            totalAnswered: 0,
            totalCorrect: 0,
            totalWrong: 0
        };

        // 从localStorage加载数据
        function loadData() {
            const savedWrongQuestions = localStorage.getItem('wrongQuestions');
            const savedProgress = localStorage.getItem('quizProgress');

            if (savedWrongQuestions) {
                window.wrongQuestions = JSON.parse(savedWrongQuestions);
            } else {
                window.wrongQuestions = [];
            }

            if (savedProgress) {
                quizProgress = JSON.parse(savedProgress);
            }
        }

        // 保存数据到localStorage
        function saveData() {
            localStorage.setItem('wrongQuestions', JSON.stringify(window.wrongQuestions));
            localStorage.setItem('quizProgress', JSON.stringify(quizProgress));
        }

        // 页面加载时初始化
        window.onload = function() {
            loadData();
            generateModuleButtons();
        };

        // 显示主菜单
        function showMainMenu() {
            hideAll();
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        // 隐藏所有区域
        function hideAll() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('moduleSelection').classList.add('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('wrongQuestionsArea').classList.add('hidden');
            document.getElementById('statsArea').classList.add('hidden');
        }

        // 生成模块选择按钮
        function generateModuleButtons() {
            const modules = [
                "模块一：领悟人生真谛",
                "模块二：坚定理想信念",
                "模块三：弘扬中国精神",
                "模块四：践行社会主义核心价值观",
                "模块五：遵守道德规范",
                "模块六：尊法学法守法用法",
                "模块七：宪法是国家的根本大法",
                "模块八：中国特色社会主义法律体系",
                "模块九：法治中国建设",
                "模块十：综合知识点"
            ];

            const container = document.getElementById('moduleButtons');
            container.innerHTML = '';

            modules.forEach(module => {
                const btn = document.createElement('div');
                btn.className = 'module-btn';
                btn.innerHTML = `<h3>${module}</h3>`;
                btn.onclick = function() {
                    this.classList.toggle('selected');
                    if (selectedModules.includes(module)) {
                        selectedModules = selectedModules.filter(m => m !== module);
                    } else {
                        selectedModules.push(module);
                    }
                };
                container.appendChild(btn);
            });
        }

        // 显示模块选择
        function showModuleSelection() {
            hideAll();
            document.getElementById('moduleSelection').classList.remove('hidden');
            selectedModules = [];
            document.querySelectorAll('.module-btn').forEach(btn => btn.classList.remove('selected'));
        }

        // 开始模块练习
        function startModulePractice() {
            if (selectedModules.length === 0) {
                alert('请至少选择一个模块！');
                return;
            }

            // 筛选选中模块的题目
            currentQuestions = [];

            // 添加单选题
            questionBank.singleChoice.forEach(q => {
                if (selectedModules.includes(q.module)) {
                    currentQuestions.push({...q, type: 'singleChoice'});
                }
            });

            // 添加判断题
            questionBank.trueFalse.forEach(q => {
                if (selectedModules.includes(q.module)) {
                    currentQuestions.push({...q, type: 'trueFalse'});
                }
            });

            // 添加论述题
            questionBank.essay.forEach(q => {
                if (selectedModules.includes(q.module)) {
                    currentQuestions.push({...q, type: 'essay'});
                }
            });

            if (currentQuestions.length === 0) {
                alert('所选模块没有题目！');
                return;
            }

            startQuiz();
        }

        // 开始模拟考试
        function startMockExam() {
            // 随机抽取题目（从所有题目中抽取50道）
            currentQuestions = [];

            // 添加单选题
            questionBank.singleChoice.forEach(q => {
                currentQuestions.push({...q, type: 'singleChoice'});
            });

            // 添加判断题
            questionBank.trueFalse.forEach(q => {
                currentQuestions.push({...q, type: 'trueFalse'});
            });

            // 添加论述题
            questionBank.essay.forEach(q => {
                currentQuestions.push({...q, type: 'essay'});
            });

            // 随机打乱
            currentQuestions = shuffleArray(currentQuestions);

            // 取前50题
            currentQuestions = currentQuestions.slice(0, Math.min(50, currentQuestions.length));

            startQuiz();
        }

        // 数组随机打乱
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 开始答题
        function startQuiz() {
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;

            hideAll();
            document.getElementById('quizArea').classList.remove('hidden');

            showQuestion();
        }

        // 显示题目
        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];

            // 更新进度
            const progress = ((currentQuestionIndex) / currentQuestions.length * 100).toFixed(0);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = progress + '%';

            // 更新统计
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            // 显示题目信息
            document.getElementById('questionNumber').textContent = `第 ${question.number} 题`;
            document.getElementById('questionContent').textContent = question.question;

            // 根据题目类型显示不同内容
            const typeMap = {
                'singleChoice': '单选题',
                'trueFalse': '判断题',
                'essay': '论述题'
            };
            document.getElementById('questionType').textContent = typeMap[question.type];

            // 显示选项
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            selectedAnswer = null;

            if (question.type === 'singleChoice') {
                question.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = function() {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedAnswer = option.charAt(0);
                    };
                    optionsContainer.appendChild(btn);
                });
            } else if (question.type === 'trueFalse') {
                const options = ['正确', '错误'];
                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = function() {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedAnswer = option === '正确' ? 'true' : 'false';
                    };
                    optionsContainer.appendChild(btn);
                });
            } else if (question.type === 'essay') {
                const textarea = document.createElement('textarea');
                textarea.className = 'essay-answer';
                textarea.placeholder = '请输入你的答案...';
                optionsContainer.appendChild(textarea);
                selectedAnswer = null;
            }

            // 隐藏反馈和参考答案
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('referenceAnswer').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
        }

        // 提交答案
        function submitAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            let userAnswer = selectedAnswer;

            // 处理论述题
            if (question.type === 'essay') {
                const textarea = document.querySelector('.essay-answer');
                userAnswer = textarea.value.trim();

                if (!userAnswer) {
                    alert('请输入答案！');
                    return;
                }

                // 显示参考答案
                const refAnswerDiv = document.getElementById('referenceAnswer');
                refAnswerDiv.innerHTML = `<h4>参考答案：</h4><p>${question.referenceAnswer.replace(/\n/g, '<br>')}</p>`;
                refAnswerDiv.classList.remove('hidden');

                // 论述题不算对错，自动下一题
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
                return;
            }

            // 检查是否选择了答案
            if (!userAnswer) {
                alert('请选择答案！');
                return;
            }

            let isCorrect = false;
            if (question.type === 'singleChoice') {
                isCorrect = userAnswer === question.answer;
            } else if (question.type === 'trueFalse') {
                isCorrect = (userAnswer === 'true') === question.answer;
            }

            // 显示反馈
            const feedbackDiv = document.getElementById('feedback');
            if (isCorrect) {
                correctCount++;
                quizProgress.totalCorrect++;
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.textContent = '✓ 回答正确！';

                // 正确答案自动跳转下一题
                setTimeout(() => {
                    nextQuestion();
                }, 800); // 0.8秒后自动跳转
            } else {
                wrongCount++;
                quizProgress.totalWrong++;

                // 添加到错题本
                addToWrongQuestions(question, userAnswer);

                feedbackDiv.className = 'feedback wrong';
                const correctText = question.type === 'trueFalse'
                    ? (question.answer ? '正确' : '错误')
                    : question.answer;
                feedbackDiv.textContent = `✗ 回答错误！正确答案是：${correctText}`;
            }
            feedbackDiv.classList.remove('hidden');

            quizProgress.totalAnswered++;
            saveData();

            // 更新统计
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            // 错误答案时显示下一题按钮，需要手动点击
            if (!isCorrect) {
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            }

            // 禁用选项按钮并标记答案
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.onclick = null;
                if (question.type === 'singleChoice') {
                    if (btn.textContent.startsWith(question.answer)) {
                        btn.classList.add('correct');
                    } else if (btn.classList.contains('selected')) {
                        btn.classList.add('wrong');
                    }
                } else if (question.type === 'trueFalse') {
                    const isSelected = btn.textContent === (question.answer ? '正确' : '错误');
                    if (isSelected) {
                        btn.classList.add('correct');
                    } else if (btn.classList.contains('selected')) {
                        btn.classList.add('wrong');
                    }
                }
            });
        }

        // 添加到错题本
        function addToWrongQuestions(question, userAnswer) {
            const wrongItem = {
                ...question,
                userAnswer: userAnswer,
                timestamp: new Date().toISOString()
            };

            // 检查是否已存在
            const exists = window.wrongQuestions.some(q =>
                q.number === wrongItem.number && q.module === wrongItem.module
            );

            if (!exists) {
                window.wrongQuestions.push(wrongItem);
                saveData();
            }
        }

        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex >= currentQuestions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        // 显示结果
        function showResult() {
            hideAll();
            document.getElementById('resultArea').classList.remove('hidden');

            const total = currentQuestions.length;
            const accuracy = ((correctCount / total) * 100).toFixed(1);

            document.getElementById('totalQuestions').textContent = total;
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalWrong').textContent = wrongCount;
            document.getElementById('accuracy').textContent = accuracy + '%';

            saveData();
        }

        // 结束答题
        function endQuiz() {
            if (confirm('确定要结束练习吗？进度将不会保存。')) {
                showMainMenu();
            }
        }

        // 显示错题本
        function showWrongQuestions() {
            hideAll();
            document.getElementById('wrongQuestionsArea').classList.remove('hidden');

            const count = window.wrongQuestions.length;
            document.getElementById('wrongQuestionsCount').textContent = `共 ${count} 道错题`;

            const listDiv = document.getElementById('wrongQuestionsList');
            listDiv.innerHTML = '';

            if (count === 0) {
                listDiv.innerHTML = '<p style="text-align: center; color: #999;">暂无错题</p>';
                return;
            }

            window.wrongQuestions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'wrong-question-item';

                let correctText = q.type === 'trueFalse'
                    ? (q.answer ? '正确' : '错误')
                    : q.answer;

                let userAnswerText = q.userAnswer;
                if (q.type === 'trueFalse') {
                    userAnswerText = q.userAnswer === 'true' ? '正确' : '错误';
                } else if (q.type === 'singleChoice') {
                    userAnswerText = q.userAnswer;
                }

                // 构建选项HTML
                let optionsHtml = '';
                if (q.type === 'singleChoice' && q.options) {
                    optionsHtml = '<div style="margin-top: 10px;">';
                    q.options.forEach(opt => {
                        const isSelected = opt.startsWith(q.userAnswer);
                        const isCorrect = opt.startsWith(q.answer);
                        let style = '';
                        if (isCorrect) {
                            style = 'color: #28a745; font-weight: bold;';
                        } else if (isSelected) {
                            style = 'color: #dc3545; text-decoration: line-through;';
                        }
                        optionsHtml += `<div style="${style}">${opt}</div>`;
                    });
                    optionsHtml += '</div>';
                } else if (q.type === 'trueFalse') {
                    optionsHtml = '<div style="margin-top: 10px;">';
                    const isCorrectTrue = q.answer === true;
                    const isSelectedTrue = q.userAnswer === 'true';
                    optionsHtml += `<div style="color: ${isCorrectTrue ? '#28a745' : '#999'}; ${isSelectedTrue && !isCorrectTrue ? 'text-decoration: line-through; color: #dc3545;' : 'font-weight: ' + (isCorrectTrue ? 'bold;' : 'normal')}">正确</div>`;
                    optionsHtml += `<div style="color: ${!isCorrectTrue ? '#28a745' : '#999'}; ${isSelectedTrue === 'false' && !isCorrectTrue ? 'text-decoration: line-through; color: #dc3545;' : 'font-weight: ' + (!isCorrectTrue ? 'bold;' : 'normal')}">错误</div>`;
                    optionsHtml += '</div>';
                }

                item.innerHTML = `
                    <div class="question-text"><strong>${index + 1}. [${q.module}]</strong> ${q.question}</div>
                    ${optionsHtml}
                    <div class="your-answer" style="margin-top: 10px;">你的答案：${userAnswerText}</div>
                    <div class="correct-answer">正确答案：${correctText}</div>
                    <button class="btn btn-secondary" style="margin-top: 10px; padding: 5px 15px; font-size: 0.9em;" onclick="removeFromWrongQuestions(${index})">移除</button>
                `;
                listDiv.appendChild(item);
            });
        }

        // 从错题本移除
        function removeFromWrongQuestions(index) {
            window.wrongQuestions.splice(index, 1);
            saveData();
            showWrongQuestions();
        }

        // 显示统计
        function showStats() {
            hideAll();
            document.getElementById('statsArea').classList.remove('hidden');

            const statsDiv = document.getElementById('learningStats');
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="number">${quizProgress.totalAnswered}</div>
                    <div class="label">总答题数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalCorrect}</div>
                    <div class="label">答对总数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalWrong}</div>
                    <div class="label">答错总数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalAnswered > 0 ? ((quizProgress.totalCorrect / quizProgress.totalAnswered) * 100).toFixed(1) + '%' : '0%'}</div>
                    <div class="label">总正确率</div>
                </div>
                <div class="stat-card">
                    <div class="number">${window.wrongQuestions.length}</div>
                    <div class="label">错题总数</div>
                </div>
            `;
        }

        // 查看错题
        function reviewWrongAnswers() {
            showWrongQuestions();
        }
    </script>
</body>
</html>
