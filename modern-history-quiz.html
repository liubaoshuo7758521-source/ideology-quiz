<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国近现代史纲要 - 答题练习系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'SimSun', Arial, sans-serif;
            background: #f5f5f5;
            background-image: url('background1.png?v=2');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 100px 20px 20px;
            position: relative;
            overflow-x: hidden;
            font-size: 18px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(245, 245, 245, 0.2);
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #28a745 0%, #34ce57 50%, #28a745 100%);
            color: white;
            padding: 25px 30px;
            border-bottom: 3px solid #1e7e34;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .main-content {
            padding: 30px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-card {
            background: white;
            border: 2px solid #999;
            padding: 25px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .menu-card:hover {
            border-color: #28a745;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .menu-card h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.4em;
            font-weight: 500;
        }

        .menu-card p {
            color: #666;
            font-size: 1em;
        }

        .menu-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background: #218838;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .hidden {
            display: none;
        }

        .module-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .module-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .module-btn:hover {
            border-color: #28a745;
            background: #f0fff4;
        }

        .module-btn.selected {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .question-container {
            background: #f8f9fa;
            padding: 25px;
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #dee2e6;
        }

        .question-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #28a745;
        }

        .question-type {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            font-size: 0.9em;
        }

        .question-content {
            font-size: 1.1em;
            line-height: 1.8;
            margin-bottom: 25px;
            color: #333;
        }

        .options-container {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 1em;
        }

        .option-btn:hover {
            border-color: #28a745;
            background: #f0fff4;
        }

        .option-btn.selected {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .option-btn.correct {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .option-btn.wrong {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            font-size: 1em;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #28a745;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 500;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #28a745;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.95;
        }

        .wrong-questions-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .wrong-question-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #dc3545;
        }

        .wrong-question-item .question-text {
            font-weight: 500;
            margin-bottom: 10px;
        }

        .wrong-question-item .your-answer {
            color: #dc3545;
            margin: 5px 0;
        }

        .wrong-question-item .correct-answer {
            color: #28a745;
            margin: 5px 0;
        }

        .back-btn {
            margin-bottom: 20px;
        }

        .essay-answer {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 15px;
        }

        .essay-answer:focus {
            outline: none;
            border-color: #28a745;
        }

        .reference-answer {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .reference-answer h4 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .reference-answer p {
            color: #856404;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .question-content {
                font-size: 1em;
            }

            .option-btn {
                padding: 12px 15px;
                font-size: 1em;
            }
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #999;
            font-size: 0.85em;
            border-top: 1px solid #eee;
            margin-top: 40px;
        }

        .footer-text {
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 中国近现代史纲要</h1>
            <p>答题练习系统 - 400题题库</p>
        </div>

        <div class="main-content">
            <!-- 主菜单 -->
            <div id="mainMenu">
                <div class="menu-grid">
                    <div class="menu-card" onclick="showModuleSelection()">
                        <div class="icon">📖</div>
                        <h3>专项练习</h3>
                        <p>按模块选择题目进行练习</p>
                    </div>
                    <div class="menu-card" onclick="startMockExam()">
                        <div class="icon">🎯</div>
                        <h3>模拟考试</h3>
                        <p>随机抽题，模拟真实考试</p>
                    </div>
                    <div class="menu-card" onclick="showWrongQuestions()">
                        <div class="icon">📝</div>
                        <h3>错题本</h3>
                        <p>复习错过的题目</p>
                    </div>
                    <div class="menu-card" onclick="showStats()">
                        <div class="icon">📊</div>
                        <h3>学习统计</h3>
                        <p>查看学习进度和成绩</p>
                    </div>
                </div>
            </div>

            <!-- 模块选择 -->
            <div id="moduleSelection" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2>选择练习模块</h2>
                <p style="margin-bottom: 20px; color: #666;">可以多选，已选模块会高亮显示</p>
                <div class="module-selection" id="moduleButtons"></div>
                <div style="margin-top: 20px;">
                    <button class="btn" onclick="startModulePractice()">开始练习</button>
                </div>
            </div>

            <!-- 答题界面 -->
            <div id="quizArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="endQuiz()">← 结束练习</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill">0%</div>
                </div>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="number" id="currentQuestion">1</div>
                        <div class="label">当前题目</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="correctCount">0</div>
                        <div class="label">正确</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="wrongCount">0</div>
                        <div class="label">错误</div>
                    </div>
                </div>
                <div class="question-container">
                    <div class="question-header">
                        <span class="question-number" id="questionNumber">第 1 题</span>
                        <span class="question-type" id="questionType">单选题</span>
                    </div>
                    <div class="question-content" id="questionContent"></div>
                    <div class="options-container" id="optionsContainer"></div>
                    <div id="feedback" class="feedback hidden"></div>
                    <div id="referenceAnswer" class="reference-answer hidden"></div>
                    <div style="margin-top: 20px; text-align: center;">
                        <button class="btn" id="submitBtn" onclick="submitAnswer()">提交答案</button>
                        <button class="btn btn-success hidden" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
                    </div>
                </div>
            </div>

            <!-- 结果页面 -->
            <div id="resultArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="text-align: center; margin-bottom: 30px;">练习完成！</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="number" id="totalQuestions">0</div>
                        <div class="label">总题数</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="finalCorrect">0</div>
                        <div class="label">正确</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="finalWrong">0</div>
                        <div class="label">错误</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="accuracy">0%</div>
                        <div class="label">正确率</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="reviewWrongAnswers()">查看错题</button>
                    <button class="btn btn-success" onclick="showMainMenu()">返回主菜单</button>
                </div>
            </div>

            <!-- 错题本 -->
            <div id="wrongQuestionsArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="margin-bottom: 20px;">错题本</h2>
                <p id="wrongQuestionsCount" style="margin-bottom: 20px; color: #666;"></p>
                <div class="wrong-questions-list" id="wrongQuestionsList"></div>
            </div>

            <!-- 统计页面 -->
            <div id="statsArea" class="hidden">
                <button class="btn btn-secondary back-btn" onclick="showMainMenu()">← 返回主菜单</button>
                <h2 style="margin-bottom: 20px;">学习统计</h2>
                <div class="stats-container" id="learningStats"></div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-text">MADE BY JASONS</div>
        </div>
    </div>

    <script src="modern-history-questions.js?v=8"></script>

    <script>
        // 调试信息
        console.log('Script loaded');
        console.log('questionBank type:', typeof questionBank);
        console.log('questionBank:', questionBank);

        // 题库数据
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let selectedAnswer = null;
        let selectedModules = [];
        let quizProgress = {
            totalAnswered: 0,
            totalCorrect: 0,
            totalWrong: 0
        };

        // 从localStorage加载数据
        function loadData() {
            const savedWrongQuestions = localStorage.getItem('wrongQuestions');
            const savedProgress = localStorage.getItem('quizProgress');

            if (savedWrongQuestions) {
                window.wrongQuestions = JSON.parse(savedWrongQuestions);
            } else {
                window.wrongQuestions = [];
            }

            if (savedProgress) {
                quizProgress = JSON.parse(savedProgress);
            }
        }

        // 保存数据到localStorage
        function saveData() {
            localStorage.setItem('wrongQuestions', JSON.stringify(window.wrongQuestions));
            localStorage.setItem('quizProgress', JSON.stringify(quizProgress));
        }

        // 页面加载时初始化
        window.onload = function() {
            console.log('Window onload fired');
            console.log('questionBank at onload:', typeof questionBank);

            loadData();

            // 等待一小段时间确保 questionBank 已加载
            setTimeout(function() {
                console.log('After timeout, questionBank:', typeof questionBank);
                if (typeof questionBank !== 'undefined') {
                    console.log('Generating module buttons...');
                    generateModuleButtons();
                } else {
                    console.error('questionBank not loaded!');
                    alert('题库加载失败，请刷新页面！');
                }
            }, 100);
        };

        // 显示主菜单
        function showMainMenu() {
            hideAll();
            document.getElementById('mainMenu').classList.remove('hidden');
        }

        // 隐藏所有区域
        function hideAll() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('moduleSelection').classList.add('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('wrongQuestionsArea').classList.add('hidden');
            document.getElementById('statsArea').classList.add('hidden');
        }

        // 生成模块选择按钮
        function generateModuleButtons() {
            // 检查 questionBank 是否存在
            if (typeof questionBank === 'undefined') {
                console.error('questionBank not loaded!');
                return;
            }

            // 从题库中动态提取所有模块
            const moduleSet = new Set();

            // 从单选题中提取模块
            if (questionBank.singleChoice) {
                questionBank.singleChoice.forEach(q => {
                    moduleSet.add(q.module);
                });
            }

            // 从判断题中提取模块
            if (questionBank.trueFalse) {
                questionBank.trueFalse.forEach(q => {
                    moduleSet.add(q.module);
                });
            }

            // 从简答题中提取模块
            if (questionBank.shortAnswer) {
                questionBank.shortAnswer.forEach(q => {
                    moduleSet.add(q.module);
                });
            }

            // 从论述题中提取模块
            if (questionBank.essay) {
                questionBank.essay.forEach(q => {
                    moduleSet.add(q.module);
                });
            }

            // 转换为数组并排序
            const modules = Array.from(moduleSet).sort();

            const container = document.getElementById('moduleButtons');
            container.innerHTML = '';

            if (modules.length === 0) {
                container.innerHTML = '<p style="color: #999;">没有可用的模块</p>';
                return;
            }

            modules.forEach(module => {
                const btn = document.createElement('div');
                btn.className = 'module-btn';
                btn.innerHTML = `<h3>${module}</h3>`;
                btn.onclick = function() {
                    this.classList.toggle('selected');
                    if (selectedModules.includes(module)) {
                        selectedModules = selectedModules.filter(m => m !== module);
                    } else {
                        selectedModules.push(module);
                    }
                };
                container.appendChild(btn);
            });
        }

        // 显示模块选择
        function showModuleSelection() {
            hideAll();
            document.getElementById('moduleSelection').classList.remove('hidden');
            selectedModules = [];
            document.querySelectorAll('.module-btn').forEach(btn => btn.classList.remove('selected'));
        }

        // 开始模块练习
        function startModulePractice() {
            if (selectedModules.length === 0) {
                alert('请至少选择一个模块！');
                return;
            }

            // 筛选选中模块的题目
            currentQuestions = [];

            // 添加单选题
            if (questionBank.singleChoice) {
                questionBank.singleChoice.forEach(q => {
                    if (selectedModules.includes(q.module)) {
                        currentQuestions.push({...q, type: 'singleChoice'});
                    }
                });
            }

            // 添加判断题
            if (questionBank.trueFalse) {
                questionBank.trueFalse.forEach(q => {
                    if (selectedModules.includes(q.module)) {
                        currentQuestions.push({...q, type: 'trueFalse'});
                    }
                });
            }

            // 添加论述题
            if (questionBank.essay) {
                questionBank.essay.forEach(q => {
                    if (selectedModules.includes(q.module)) {
                        currentQuestions.push({...q, type: 'essay'});
                    }
                });
            }

            if (currentQuestions.length === 0) {
                alert('所选模块没有题目！');
                return;
            }

            startQuiz();
        }

        // 开始模拟考试
        function startMockExam() {
            // 检查 questionBank 是否存在
            if (typeof questionBank === 'undefined') {
                alert('题库加载失败，请刷新页面重试！');
                return;
            }

            // 随机抽取题目（从所有题目中抽取50道）
            currentQuestions = [];

            // 添加单选题
            if (questionBank.singleChoice) {
                questionBank.singleChoice.forEach(q => {
                    currentQuestions.push({...q, type: 'singleChoice'});
                });
            }

            // 添加判断题
            if (questionBank.trueFalse) {
                questionBank.trueFalse.forEach(q => {
                    currentQuestions.push({...q, type: 'trueFalse'});
                });
            }

            // 添加论述题
            if (questionBank.essay) {
                questionBank.essay.forEach(q => {
                    currentQuestions.push({...q, type: 'essay'});
                });
            }

            if (currentQuestions.length === 0) {
                alert('题库中没有题目！');
                return;
            }

            // 随机打乱
            currentQuestions = shuffleArray(currentQuestions);

            // 取前50题
            currentQuestions = currentQuestions.slice(0, Math.min(50, currentQuestions.length));

            startQuiz();
        }

        // 数组随机打乱
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 开始答题
        function startQuiz() {
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;

            hideAll();
            document.getElementById('quizArea').classList.remove('hidden');

            showQuestion();
        }

        // 显示题目
        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];

            // 更新进度
            const progress = ((currentQuestionIndex) / currentQuestions.length * 100).toFixed(0);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = progress + '%';

            // 更新统计
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            // 显示题目信息
            document.getElementById('questionNumber').textContent = `第 ${question.id} 题`;
            document.getElementById('questionContent').textContent = question.question;

            // 根据题目类型显示不同内容
            const typeMap = {
                'singleChoice': '单选题',
                'trueFalse': '判断题',
                'essay': '论述题'
            };
            document.getElementById('questionType').textContent = typeMap[question.type];

            // 显示选项
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            selectedAnswer = null;

            if (question.type === 'singleChoice') {
                question.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = function() {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedAnswer = option.charAt(0);
                    };
                    optionsContainer.appendChild(btn);
                });
            } else if (question.type === 'trueFalse') {
                const options = ['正确', '错误'];
                options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = function() {
                        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedAnswer = option === '正确' ? 'true' : 'false';
                    };
                    optionsContainer.appendChild(btn);
                });
            } else if (question.type === 'essay') {
                const textarea = document.createElement('textarea');
                textarea.className = 'essay-answer';
                textarea.placeholder = '请输入你的答案...';
                optionsContainer.appendChild(textarea);
                selectedAnswer = null;
            }

            // 隐藏反馈和参考答案
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('referenceAnswer').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
        }

        // 提交答案
        function submitAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            let userAnswer = selectedAnswer;

            // 处理论述题
            if (question.type === 'essay') {
                const textarea = document.querySelector('.essay-answer');
                userAnswer = textarea.value.trim();

                if (!userAnswer) {
                    alert('请输入答案！');
                    return;
                }

                // 显示参考答案
                const refAnswerDiv = document.getElementById('referenceAnswer');
                refAnswerDiv.innerHTML = `<h4>参考答案：</h4><p>${question.answer.replace(/\n/g, '<br>')}</p>`;
                refAnswerDiv.classList.remove('hidden');

                // 论述题不算对错，自动下一题
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
                return;
            }

            // 检查是否选择了答案
            if (!userAnswer) {
                alert('请选择答案！');
                return;
            }

            let isCorrect = false;
            if (question.type === 'singleChoice') {
                isCorrect = userAnswer === question.answer;
            } else if (question.type === 'trueFalse') {
                isCorrect = (userAnswer === 'true') === question.answer;
            }

            // 显示反馈
            const feedbackDiv = document.getElementById('feedback');
            if (isCorrect) {
                correctCount++;
                quizProgress.totalCorrect++;
                feedbackDiv.className = 'feedback correct';
                feedbackDiv.textContent = '✓ 回答正确！';

                // 正确答案自动跳转下一题
                setTimeout(() => {
                    nextQuestion();
                }, 800); // 0.8秒后自动跳转
            } else {
                wrongCount++;
                quizProgress.totalWrong++;

                // 添加到错题本
                addToWrongQuestions(question, userAnswer);

                feedbackDiv.className = 'feedback wrong';
                const correctText = question.type === 'trueFalse'
                    ? (question.answer ? '正确' : '错误')
                    : question.answer;
                feedbackDiv.textContent = `✗ 回答错误！正确答案是：${correctText}`;
            }
            feedbackDiv.classList.remove('hidden');

            quizProgress.totalAnswered++;
            saveData();

            // 更新统计
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;

            // 错误答案时显示下一题按钮，需要手动点击
            if (!isCorrect) {
                document.getElementById('submitBtn').classList.add('hidden');
                document.getElementById('nextBtn').classList.remove('hidden');
            }

            // 禁用选项按钮并标记答案
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.onclick = null;
                if (question.type === 'singleChoice') {
                    if (btn.textContent.startsWith(question.answer)) {
                        btn.classList.add('correct');
                    } else if (btn.classList.contains('selected')) {
                        btn.classList.add('wrong');
                    }
                } else if (question.type === 'trueFalse') {
                    const isSelected = btn.textContent === (question.answer ? '正确' : '错误');
                    if (isSelected) {
                        btn.classList.add('correct');
                    } else if (btn.classList.contains('selected')) {
                        btn.classList.add('wrong');
                    }
                }
            });
        }

        // 添加到错题本
        function addToWrongQuestions(question, userAnswer) {
            const wrongItem = {
                ...question,
                userAnswer: userAnswer,
                timestamp: new Date().toISOString()
            };

            // 检查是否已存在
            const exists = window.wrongQuestions.some(q =>
                q.id === wrongItem.id && q.module === wrongItem.module
            );

            if (!exists) {
                window.wrongQuestions.push(wrongItem);
                saveData();
            }
        }

        // 下一题
        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex >= currentQuestions.length) {
                showResult();
            } else {
                showQuestion();
            }
        }

        // 显示结果
        function showResult() {
            hideAll();
            document.getElementById('resultArea').classList.remove('hidden');

            const total = currentQuestions.length;
            const accuracy = ((correctCount / total) * 100).toFixed(1);

            document.getElementById('totalQuestions').textContent = total;
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalWrong').textContent = wrongCount;
            document.getElementById('accuracy').textContent = accuracy + '%';

            saveData();
        }

        // 结束答题
        function endQuiz() {
            if (confirm('确定要结束练习吗？进度将不会保存。')) {
                showMainMenu();
            }
        }

        // 显示错题本
        function showWrongQuestions() {
            hideAll();
            document.getElementById('wrongQuestionsArea').classList.remove('hidden');

            const count = window.wrongQuestions.length;
            document.getElementById('wrongQuestionsCount').textContent = `共 ${count} 道错题`;

            const listDiv = document.getElementById('wrongQuestionsList');
            listDiv.innerHTML = '';

            if (count === 0) {
                listDiv.innerHTML = '<p style="text-align: center; color: #999;">暂无错题</p>';
                return;
            }

            window.wrongQuestions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'wrong-question-item';

                let correctText = q.type === 'trueFalse'
                    ? (q.answer ? '正确' : '错误')
                    : q.answer;

                let userAnswerText = q.userAnswer;
                if (q.type === 'trueFalse') {
                    userAnswerText = q.userAnswer === 'true' ? '正确' : '错误';
                } else if (q.type === 'singleChoice') {
                    userAnswerText = q.userAnswer;
                }

                // 构建选项HTML
                let optionsHtml = '';
                if (q.type === 'singleChoice' && q.options) {
                    optionsHtml = '<div style="margin-top: 10px;">';
                    q.options.forEach(opt => {
                        const isSelected = opt.startsWith(q.userAnswer);
                        const isCorrect = opt.startsWith(q.answer);
                        let style = '';
                        if (isCorrect) {
                            style = 'color: #28a745; font-weight: bold;';
                        } else if (isSelected) {
                            style = 'color: #dc3545; text-decoration: line-through;';
                        }
                        optionsHtml += `<div style="${style}">${opt}</div>`;
                    });
                    optionsHtml += '</div>';
                } else if (q.type === 'trueFalse') {
                    optionsHtml = '<div style="margin-top: 10px;">';
                    const isCorrectTrue = q.answer === true;
                    const isSelectedTrue = q.userAnswer === 'true';
                    optionsHtml += `<div style="color: ${isCorrectTrue ? '#28a745' : '#999'}; ${isSelectedTrue && !isCorrectTrue ? 'text-decoration: line-through; color: #dc3545;' : 'font-weight: ' + (isCorrectTrue ? 'bold;' : 'normal')}">正确</div>`;
                    optionsHtml += `<div style="color: ${!isCorrectTrue ? '#28a745' : '#999'}; ${isSelectedTrue === 'false' && !isCorrectTrue ? 'text-decoration: line-through; color: #dc3545;' : 'font-weight: ' + (!isCorrectTrue ? 'bold;' : 'normal')}">错误</div>`;
                    optionsHtml += '</div>';
                }

                item.innerHTML = `
                    <div class="question-text"><strong>${index + 1}. [${q.module}]</strong> ${q.question}</div>
                    ${optionsHtml}
                    <div class="your-answer" style="margin-top: 10px;">你的答案：${userAnswerText}</div>
                    <div class="correct-answer">正确答案：${correctText}</div>
                    <button class="btn btn-secondary" style="margin-top: 10px; padding: 5px 15px; font-size: 0.9em;" onclick="removeFromWrongQuestions(${index})">移除</button>
                `;
                listDiv.appendChild(item);
            });
        }

        // 从错题本移除
        function removeFromWrongQuestions(index) {
            window.wrongQuestions.splice(index, 1);
            saveData();
            showWrongQuestions();
        }

        // 显示统计
        function showStats() {
            hideAll();
            document.getElementById('statsArea').classList.remove('hidden');

            const statsDiv = document.getElementById('learningStats');
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="number">${quizProgress.totalAnswered}</div>
                    <div class="label">总答题数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalCorrect}</div>
                    <div class="label">答对总数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalWrong}</div>
                    <div class="label">答错总数</div>
                </div>
                <div class="stat-card">
                    <div class="number">${quizProgress.totalAnswered > 0 ? ((quizProgress.totalCorrect / quizProgress.totalAnswered) * 100).toFixed(1) + '%' : '0%'}</div>
                    <div class="label">总正确率</div>
                </div>
                <div class="stat-card">
                    <div class="number">${window.wrongQuestions.length}</div>
                    <div class="label">错题总数</div>
                </div>
            `;
        }

        // 查看错题
        function reviewWrongAnswers() {
            showWrongQuestions();
        }
    </script>
</body>
</html>
